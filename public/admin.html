<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarLucky Admin</title><style>body{font-family:system-ui;background:#080808;color:#fff;margin:0;padding:22px;max-width:900px}input,textarea,button{font:inherit;border-radius:10px;border:1px solid #333;background:#111;color:#fff;padding:10px}button{background:#ffc653;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid #252525;border-radius:16px;padding:14px;background:#101010;margin:12px 0}label{display:grid;gap:6px;margin:8px 0;color:#aaa}h1,h2{color:#ffc653}</style></head><body><h1>StarLucky Admin</h1><label>ADMIN_TOKEN<input id="token" type="password"></label><div class="grid"><section class="card"><h2>Создать подарок/кейс</h2><label>Название<input id="g_title"></label><label>Описание<textarea id="g_desc"></textarea></label><label>Цена в звездах<input id="g_price" type="number" value="100"></label><label>Stock<input id="g_stock" type="number" value="1"></label><label>PNG/JPG URL<input id="g_img"></label><label>Animation URL MP4/WebM/Lottie<input id="g_anim"></label><label>Фон CSS<input id="g_bg" value="linear-gradient(135deg,rgba(255,198,79,.18),rgba(255,255,255,.04))"></label><button onclick="saveGift()">Сохранить подарок</button></section><section class="card"><h2>Создать задание</h2><label>Название<input id="t_title"></label><label>Описание<textarea id="t_desc"></textarea></label><label>Награда<input id="t_reward" type="number" value="0"></label><label>Картинка PNG/JPG URL<input id="t_img"></label><label>Текст кнопки<input id="t_btn" value="Открыть"></label><label>Ссылка кнопки<input id="t_url"></label><label>Сортировка<input id="t_sort" type="number" value="0"></label><button onclick="saveTask()">Сохранить задание</button></section></div><section class="card"><h2>Заявки заданий</h2><button onclick="loadClaims()">Обновить</button><div id="claims"></div></section><script>function h(){return {'content-type':'application/json','x-admin-token':document.getElementById('token').value}}async function api(u,o={}){const r=await fetch(u,{...o,headers:{...h(),...(o.headers||{})}});return r.json()}async function saveGift(){const b={title:g_title.value,description:g_desc.value,price_stars:+g_price.value,stock:+g_stock.value,image_url:g_img.value,animation_url:g_anim.value,background_css:g_bg.value,active:true};alert(JSON.stringify(await api('/api/admin/gifts',{method:'POST',body:JSON.stringify(b)})))}async function saveTask(){const b={title:t_title.value,description:t_desc.value,reward_stars:+t_reward.value,image_url:t_img.value,button_text:t_btn.value,button_url:t_url.value,sort_order:+t_sort.value,active:true};alert(JSON.stringify(await api('/api/admin/tasks',{method:'POST',body:JSON.stringify(b)})))}async function loadClaims(){const d=await api('/api/admin/claims');claims.innerHTML=(d.claims||[]).map(c=>`<div class="card"><b>${c.title}</b> · ${c.display_name} · ${c.status}<br><small>${c.proof||''}</small><br>${c.status==='pending'?`<button onclick="approve('${c.id}')">Approve +${c.reward_stars}</button>`:''}</div>`).join('')}async function approve(id){alert(JSON.stringify(await api('/api/admin/claims/'+id+'/approve',{method:'POST',body:'{}'})));loadClaims()}</script></body></html>
