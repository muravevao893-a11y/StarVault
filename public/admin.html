<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarLucky Admin</title><style>body{margin:0;background:#080808;color:#eee;font-family:system-ui;padding:20px}input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#141414;color:#eee}button{background:#ffc15a;color:#120f0a;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#101010;border:1px solid #222;border-radius:14px;padding:14px}pre{white-space:pre-wrap;background:#111;padding:12px;border-radius:10px;max-height:260px;overflow:auto}.small{color:#999}</style></head><body><h1>StarLucky Admin</h1><input id="token" placeholder="ADMIN_TOKEN"><button onclick="load()">Загрузить</button><div class="grid"><div class="card"><h2>Подарок</h2><input id="gtitle" placeholder="Название"><input id="gprice" type="number" placeholder="Цена"><input id="gstock" type="number" placeholder="Stock"><input id="gimg" placeholder="PNG/JPG URL"><input id="ganim" placeholder="MP4/WebM animation URL"><textarea id="gbg" placeholder="CSS фон, например linear-gradient(135deg,#b34,#111)"></textarea><button onclick="createGift()">Создать подарок</button></div><div class="card"><h2>Кейс</h2><input id="ctitle" placeholder="Название"><input id="cprice" type="number" placeholder="Цена"><input id="cstock" type="number" placeholder="Stock"><input id="cimg" placeholder="Image URL"><textarea id="cbg" placeholder="CSS фон"></textarea><button onclick="createCase()">Создать кейс</button><h3>Награда кейса</h3><input id="rcase" type="number" placeholder="case_id"><input id="rtitle" placeholder="Название награды"><input id="rweight" type="number" placeholder="Вес шанса"><input id="rvalue" type="number" placeholder="Цена/лейбл в звездах"><input id="rimg" placeholder="Image URL"><input id="ranim" placeholder="Animation URL"><textarea id="rbg" placeholder="CSS фон"></textarea><button onclick="createReward()">Добавить награду</button></div><div class="card"><h2>Задание</h2><input id="ttitle" placeholder="Название"><textarea id="tdesc" placeholder="Описание"></textarea><input id="treward" type="number" placeholder="Награда"><input id="timg" placeholder="PNG/JPG URL"><input id="tbtn" placeholder="Текст кнопки"><input id="turl" placeholder="Ссылка кнопки"><button onclick="createTask()">Создать задание</button></div><div class="card"><h2>Начислить баланс</h2><input id="uid" type="number" placeholder="user_id"><input id="amount" type="number" placeholder="amount"><input id="note" placeholder="note"><button onclick="credit()">Начислить</button><p class="small">Только админ. Все записи идут в ledger.</p></div></div><h2>Данные</h2><pre id="out">—</pre><script>const $=id=>document.getElementById(id);async function api(u,b){let r=await fetch(u,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-admin-token':$('token').value},body:b?JSON.stringify(b):undefined});let j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){out.textContent=JSON.stringify(await api('/api/admin/all'),null,2)}async function createGift(){await api('/api/admin/gift',{title:gtitle.value,price:+gprice.value,stock:+gstock.value,image_url:gimg.value,animation_url:ganim.value,bg_css:gbg.value});load()}async function createCase(){await api('/api/admin/case',{title:ctitle.value,price:+cprice.value,stock:+cstock.value,image_url:cimg.value,bg_css:cbg.value});load()}async function createReward(){await api('/api/admin/case-reward',{case_id:+rcase.value,title:rtitle.value,weight:+rweight.value,value_stars:+rvalue.value,image_url:rimg.value,animation_url:ranim.value,bg_css:rbg.value});load()}async function createTask(){await api('/api/admin/task',{title:ttitle.value,description:tdesc.value,reward:+treward.value,image_url:timg.value,button_text:tbtn.value,button_url:turl.value});load()}async function credit(){await api('/api/admin/credit',{user_id:+uid.value,amount:+amount.value,note:note.value});load()}</script></body></html>
