<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarLucky Admin</title><style>body{margin:0;background:#080808;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:22px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.card{background:#111;border:1px solid #252525;border-radius:14px;padding:16px;margin:14px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #333;border-radius:10px;color:#fff;padding:11px;margin:6px 0 10px}button{background:#ffc15a;color:#171006;border:0;border-radius:10px;font-weight:900;padding:10px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.muted{color:#999}.row{display:grid;grid-template-columns:1.1fr .8fr .8fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #222;font-size:13px}.pill{display:inline-block;background:#1d1d1f;border:1px solid #333;border-radius:999px;padding:5px 9px}h1,h2,h3{margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#151515;border:1px solid #282828;border-radius:12px;padding:12px}.stat b{font-size:26px;color:#ffc15a}</style></head><body><div class="wrap"><div class="top"><h1>StarLucky Admin</h1><input id="token" placeholder="ADMIN_TOKEN" style="max-width:360px"></div><div class="stats" id="stats"></div><div class="grid"><div class="card"><h2>Создать подарок</h2><input id="gTitle" placeholder="Название"><textarea id="gDesc" placeholder="Описание"></textarea><input id="gPrice" type="number" placeholder="Цена в звездах"><input id="gStock" type="number" placeholder="Stock"><input id="gImage" placeholder="PNG/JPG URL"><input id="gAnim" placeholder="MP4/WebM animation URL"><input id="gBg" placeholder="CSS фон, например background:#442"><button onclick="createGift()">Создать подарок</button></div><div class="card"><h2>Создать задание</h2><input id="tTitle" placeholder="Название"><textarea id="tDesc" placeholder="Описание"></textarea><input id="tReward" type="number" placeholder="Награда"><input id="tImage" placeholder="PNG/JPG URL"><input id="tBtnText" placeholder="Текст кнопки"><input id="tBtnUrl" placeholder="Ссылка кнопки"><button onclick="createTask()">Создать задание</button></div><div class="card"><h2>Баланс пользователя</h2><input id="bTg" placeholder="Telegram ID"><input id="bAmount" type="number" placeholder="+/- сумма"><input id="bReason" placeholder="Причина"><button onclick="adjustBalance()">Применить</button></div></div><div class="card"><h2>Пользователи</h2><input id="userQ" placeholder="Поиск по ID / username / имени"><button onclick="loadUsers()">Найти</button><div id="users"></div></div><div class="grid"><div class="card"><h2>Заявки на выдачу</h2><div id="orders"></div></div><div class="card"><h2>Заявки заданий</h2><div id="subs"></div></div></div></div><script>const $=id=>document.getElementById(id);function token(){return $('token').value.trim()}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json','x-admin-token':token(),...(opt.headers||{})}});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||j.code);return j}function row(a,b,c,d=''){return `<div class=row><div>${a}</div><div>${b}</div><div>${c}</div><div>${d}</div></div>`}async function loadStats(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class=stat>Users<br><b>${s.users||0}</b></div><div class=stat>Total balance<br><b>${s.totalBalance||0}</b></div><div class=stat>Orders<br><b>${s.deliveryOrders||0}</b></div><div class=stat>Pending tasks<br><b>${s.pendingTasks||0}</b></div><div class=stat>Paid payments<br><b>${s.paidPayments||0}</b></div>`}catch(e){$('stats').innerHTML='<div class=muted>Вставь ADMIN_TOKEN</div>'}}async function createGift(){try{await api('/api/admin/gifts',{method:'POST',body:JSON.stringify({title:$('gTitle').value,description:$('gDesc').value,price_stars:+$('gPrice').value,stock:+$('gStock').value,image_url:$('gImage').value,animation_url:$('gAnim').value,background_css:$('gBg').value})});alert('Подарок создан');loadStats()}catch(e){alert(e.message)}}async function createTask(){try{await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:$('tTitle').value,description:$('tDesc').value,reward_stars:+$('tReward').value,image_url:$('tImage').value,button_text:$('tBtnText').value,button_url:$('tBtnUrl').value})});alert('Задание создано');loadStats()}catch(e){alert(e.message)}}async function adjustBalance(){try{await api('/api/admin/balance',{method:'POST',body:JSON.stringify({telegramId:$('bTg').value,amount:+$('bAmount').value,reason:$('bReason').value})});alert('Готово');loadUsers();loadStats()}catch(e){alert(e.message)}}async function loadUsers(){try{const j=await api('/api/admin/users?q='+encodeURIComponent($('userQ').value));$('users').innerHTML=j.users.map(u=>row(`${u.first_name||''} ${u.last_name||''}<br><span class=muted>@${u.username||''}</span>`,u.telegram_id,`${u.balance_stars} ★ / L${u.level}`,`<span class=pill>${u.wallet_address?'wallet':'no wallet'}</span>`)).join('')||'<p class=muted>Нет пользователей</p>'}catch(e){alert(e.message)}}async function loadOrders(){try{const j=await api('/api/admin/orders');$('orders').innerHTML=j.orders.map(o=>row(`#${o.id} ${o.title||''}<br><span class=muted>${o.telegram_id}</span>`,o.status,o.created_at?.slice(0,16),`<select onchange="updOrder(${o.id},this.value)"><option>new</option><option>processing</option><option>delivered</option><option>rejected</option></select>`)).join('')||'<p class=muted>Нет заявок</p>'}catch(e){}}async function updOrder(id,status){try{await api('/api/admin/orders/'+id,{method:'POST',body:JSON.stringify({status})});loadOrders();loadStats()}catch(e){alert(e.message)}}async function loadSubs(){try{const j=await api('/api/admin/task-submissions');$('subs').innerHTML=j.submissions.map(s=>row(`#${s.id} ${s.title}<br><span class=muted>${s.telegram_id}</span>`,s.status,`${s.reward_stars} ★`,s.status==='pending'?`<button onclick="updSub(${s.id},'approved')">OK</button> <button onclick="updSub(${s.id},'rejected')">NO</button>`:'' )).join('')||'<p class=muted>Нет заявок</p>'}catch(e){}}async function updSub(id,status){try{await api('/api/admin/task-submissions/'+id,{method:'POST',body:JSON.stringify({status})});loadSubs();loadStats()}catch(e){alert(e.message)}}setInterval(()=>{if(token()){loadStats();loadOrders();loadSubs()}},5000);$('token').onchange=()=>{loadStats();loadUsers();loadOrders();loadSubs()};loadStats();</script></body></html>
