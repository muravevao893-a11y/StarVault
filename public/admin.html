<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarLucky Admin</title><style>body{margin:0;background:#070707;color:white;font-family:system-ui;padding:20px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{padding:12px 16px;border-radius:12px;border:0;background:#ffc657;color:#130d04;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#101012;border:1px solid rgba(255,198,87,.2);border-radius:16px;padding:16px}.item{padding:12px;border-bottom:1px solid #222}.muted{color:#aaa}.danger{background:#333;color:#fff}</style></head><body><h1>StarLucky Admin</h1><p class="muted">Токен хранится только в браузере. Создавай задания/подарки и вручную одобряй заявки.</p><label>ADMIN_TOKEN</label><input id="token" placeholder="ADMIN_TOKEN"><button onclick="saveToken()">Сохранить токен</button><div class="grid"><section class="card"><h2>Создать задание</h2><input id="tTitle" placeholder="Название"><textarea id="tDesc" placeholder="Описание"></textarea><input id="tReward" type="number" placeholder="Награда в звездах"><input id="tImg" placeholder="PNG/JPG URL картинки"><input id="tBtn" placeholder="Текст кнопки" value="Открыть"><input id="tUrl" placeholder="Ссылка кнопки"><button onclick="createTask()">Создать</button></section><section class="card"><h2>Создать подарок</h2><input id="gTitle" placeholder="Название"><textarea id="gDesc" placeholder="Описание"></textarea><input id="gPrice" type="number" placeholder="Цена в звездах"><input id="gStock" type="number" placeholder="Stock"><input id="gImg" placeholder="PNG/JPG URL картинки"><button onclick="createGift()">Создать</button></section><section class="card"><h2>Начислить вручную</h2><input id="cTg" type="number" placeholder="Telegram ID пользователя"><input id="cAmount" type="number" placeholder="Сумма"><input id="cReason" placeholder="Причина"><button onclick="credit()">Начислить</button></section></div><div class="grid" style="margin-top:16px"><section class="card"><h2>Заявки</h2><button onclick="loadClaims()">Обновить</button><div id="claims"></div></section><section class="card"><h2>Задания</h2><button onclick="loadTasks()">Обновить</button><div id="tasks"></div></section><section class="card"><h2>Подарки</h2><button onclick="loadGifts()">Обновить</button><div id="gifts"></div></section></div><script>token.value=localStorage.adminToken||'';function saveToken(){localStorage.adminToken=token.value;alert('saved')}function api(u,o={}){return fetch(u,{...o,headers:{'content-type':'application/json','x-admin-token':token.value,...(o.headers||{})}}).then(r=>r.json())}async function createTask(){const r=await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:tTitle.value,description:tDesc.value,rewardStars:+tReward.value,imageUrl:tImg.value,buttonText:tBtn.value,buttonUrl:tUrl.value})});alert(r.ok?'created':r.error);loadTasks()}async function createGift(){const r=await api('/api/admin/gifts',{method:'POST',body:JSON.stringify({title:gTitle.value,description:gDesc.value,priceStars:+gPrice.value,stock:+gStock.value,imageUrl:gImg.value})});alert(r.ok?'created':r.error);loadGifts()}async function credit(){const r=await api('/api/admin/credit',{method:'POST',body:JSON.stringify({telegramId:+cTg.value,amountStars:+cAmount.value,reason:cReason.value})});alert(r.ok?'credited':r.error)}async function loadClaims(){const r=await api('/api/admin/claims');claims.innerHTML=r.ok?r.claims.map(c=>`<div class=item><b>${c.title}</b><br>User: ${c.first_name||''} ${c.last_name||''} @${c.username||''} (${c.telegram_id})<br>Reward: ${c.reward_stars} ★<br>Status: ${c.status}<br>Evidence: ${c.evidence||'-'}<br><button onclick="approve(${c.id})">Approve</button> <button class=danger onclick="reject(${c.id})">Reject</button></div>`).join(''):r.error}async function approve(id){const r=await api('/api/admin/claims/'+id+'/approve',{method:'POST'});alert(r.ok?'approved':r.error);loadClaims()}async function reject(id){const r=await api('/api/admin/claims/'+id+'/reject',{method:'POST'});alert(r.ok?'rejected':r.error);loadClaims()}async function loadTasks(){const r=await api('/api/admin/tasks');tasks.innerHTML=r.ok?r.tasks.map(t=>`<div class=item><b>#${t.id} ${t.title}</b><br>${t.reward_stars} ★ · active ${t.is_active}<br>${t.button_url||''}</div>`).join(''):r.error}async function loadGifts(){const r=await api('/api/admin/gifts');gifts.innerHTML=r.ok?r.gifts.map(g=>`<div class=item><b>#${g.id} ${g.title}</b><br>${g.price_stars} ★ · stock ${g.stock}</div>`).join(''):r.error}loadClaims();loadTasks();loadGifts();</script></body></html>
