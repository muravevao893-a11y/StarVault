<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarLucky</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script><style>
:root{--bg:#070707;--p:#111113;--p2:#171717;--line:rgba(255,199,86,.18);--gold:#ffc15a;--gold2:#f59f22;--mut:#8d8d96;--text:#f7f7fa;--nav:66px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text)}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}.app{max-width:390px;height:100dvh;margin:auto;background:radial-gradient(circle at 65% 0,rgba(255,193,90,.12),transparent 22%),#060606;position:relative;overflow:hidden}.top{height:66px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(14,15,17,.72);border-bottom:1px solid rgba(255,255,255,.05);backdrop-filter:blur(14px);position:relative;z-index:8}.brand{font-size:20px;font-weight:950;letter-spacing:-.5px;text-shadow:0 0 20px rgba(255,193,90,.22)}.brand span{color:var(--gold)}.bal{height:34px;display:flex;align-items:center;gap:7px;padding:4px 4px 4px 10px;background:rgba(35,35,35,.85);border:1px solid var(--line);border-radius:999px;font-weight:900}.star{width:15px;height:15px;color:var(--gold);filter:drop-shadow(0 0 6px #ffc15a66)}.plus{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffd488,#ffb14d);color:#120f0a}.plus svg{width:15px;height:15px}.plus path{stroke:currentColor;stroke-width:2.7;stroke-linecap:round}.content{height:calc(100dvh - 66px);overflow-y:auto;padding:12px 10px calc(var(--nav) + 18px);scrollbar-width:none}.content::-webkit-scrollbar{display:none}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.ref{height:31px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;gap:6px;align-items:center;font-weight:800;font-size:12px}.sec{font-size:14px;font-weight:950;margin:12px 0 8px}.dot{display:inline-block;width:7px;height:7px;background:#ff2c83;border-radius:50%;box-shadow:0 0 10px #ff2c83;margin-right:6px}.drops{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.drop{min-width:59px;height:72px;border-radius:9px;background:linear-gradient(145deg,rgba(255,199,86,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative}.drop .media{height:51px;display:grid;place-items:center;background:var(--bgc,linear-gradient(135deg,#2b2110,#131313))}.drop img,.drop video{max-width:100%;max-height:100%;object-fit:cover}.drop b{display:block;text-align:center;font-size:10px;margin-top:3px}.tabs{height:43px;margin:12px -10px 12px;padding:0 10px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05)}.tabs button{font-size:12px;font-weight:900;color:#aaa;position:relative}.tabs button.on{color:var(--gold)}.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);box-shadow:0 0 14px var(--gold)}.game{height:164px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,193,90,.12),rgba(255,255,255,.025)),#101010;margin-bottom:10px;position:relative;overflow:hidden;padding:18px 16px}.game h2{font-size:27px;line-height:.93;margin:0 0 8px;font-weight:1000}.game h2 span{display:block;color:var(--gold)}.game p{font-size:12px;color:#cfcfd4;max-width:170px}.wheel{position:absolute;width:158px;height:158px;right:-28px;top:6px;border-radius:50%;background:conic-gradient(#ffbc39,#f247a6,#5f5cff,#9df76a,#ffbc39);transition:transform 2.2s cubic-bezier(.15,.85,.2,1)}.wheel:before{content:"";position:absolute;inset:28px;border-radius:50%;background:#161616;border:16px solid rgba(255,199,86,.42)}.wheel:after{content:"";position:absolute;inset:61px;border-radius:50%;background:linear-gradient(#ffd47a,#f7a01f)}.play{position:absolute;right:14px;bottom:16px;height:44px;min-width:112px;border-radius:12px;background:#0a0d0e;border:1px solid var(--line);color:var(--gold);font-weight:1000;font-size:18px}.case-grid,.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:154px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#121214;overflow:hidden}.tile .pic{height:96px;background:var(--bgc,linear-gradient(135deg,#2b2110,#111));display:grid;place-items:center}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.tile .body{padding:10px;text-align:center}.tile h3{margin:0 0 8px;font-size:14px}.price{font-weight:950;color:var(--gold)}.profile{height:310px;margin:-12px -10px 12px;padding:20px 14px;background:radial-gradient(circle at 50% 5%,rgba(255,193,90,.18),transparent 45%),linear-gradient(180deg,#17100a,#080808);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}.ava{width:74px;height:74px;border-radius:50%;border:1px solid var(--line);background:#111;display:grid;place-items:center;font-size:30px;font-weight:950;overflow:hidden;box-shadow:0 0 26px rgba(255,193,90,.14)}.ava img{width:100%;height:100%;object-fit:cover}.name{margin-top:12px;font-weight:950;font-size:22px}.wide{width:100%;height:39px;border:1px solid var(--line);border-radius:9px;color:var(--gold);background:rgba(255,193,90,.08);font-weight:950;margin-top:14px}.mini{border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#111113;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.mut{color:var(--mut);font-size:12px}.bar{height:8px;background:#252529;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,#ffb14d,#ffd283)}.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.subtabs button{height:32px;border-radius:999px;background:#151518;border:1px solid rgba(255,255,255,.08);font-weight:850;font-size:12px}.subtabs button.on{background:var(--gold);color:#140e05}.task{display:flex;gap:12px;align-items:center}.task img{width:64px;height:64px;border-radius:9px;object-fit:cover}.task .go{margin-left:auto;height:34px;padding:0 13px;border-radius:8px;background:#202025;font-weight:850}.empty{height:160px;display:grid;place-items:center;text-align:center;color:#c8c8cf}.nav{height:var(--nav);position:absolute;left:0;right:0;bottom:0;background:rgba(7,7,8,.98);border-top:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8c8c93;font-size:11px;font-weight:800}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}.nav button.on{color:var(--gold);text-shadow:0 0 14px #ffc15a66}.screen{display:none}.screen.on{display:block}.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:84dvh;overflow:auto;border-radius:22px 22px 0 0;background:#141416;padding:18px 10px 24px}.close{position:absolute;right:17px;top:18px;width:38px;height:38px;border-radius:50%;background:#202025;font-size:28px}.amount{height:47px;border:1px solid rgba(255,255,255,.07);border-radius:8px;margin-bottom:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:850}.ton-root{display:none}.case-anim{display:flex;gap:7px;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}.case-anim .slot{min-width:70px;height:70px;border-radius:8px;background:#1a1a1d;display:grid;place-items:center;animation:roll 1.4s ease both}.case-anim img{width:100%;height:100%;object-fit:cover;border-radius:8px}@keyframes roll{0%{transform:translateX(120px) scale(.85);opacity:.3}70%{transform:translateX(-30px)}100%{transform:translateX(0);opacity:1}}.spin .wheel{transform:rotate(1600deg)}@media(min-width:780px){body{display:grid;place-items:center}.app{border-radius:18px;height:min(860px,100dvh)}}
</style></head><body><div class="app"><header class="top"><div class="brand">Star<span>Lucky</span></div><div class="bal"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.35 6.2 20.4l1.1-6.47-4.7-4.58 6.5-.95L12 2.5z"/></svg><span id="bal">0</span><button class="plus" id="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></header><main class="content">
<section id="games" class="screen on"><div class="topline"><button class="ref">🔗 Реф. ссылка</button></div><div class="sec"><span class="dot"></span>Лайв дропы</div><div class="drops" id="drops"></div><div class="tabs"><button class="on">⚔ ARCADE</button><button>↗ PVP</button><button>ϟ PVE</button></div><div class="game" id="spinGame"><h2>STAR<span>SPIN</span></h2><p>Анимированная рулетка множителей. Результат считает сервер.</p><div class="wheel"></div><button class="play" id="spinBtn">Играть ›</button></div><div class="game"><h2>COLOR<span>ROULETTE</span></h2><p>Цветовая рулетка с плавной прокруткой и серверным результатом.</p><div class="wheel" style="transform:rotate(30deg)"></div><button class="play" id="colorBtn">Играть ›</button></div></section>
<section id="cases" class="screen"><div class="sec">Кейсы</div><div id="caseGrid" class="case-grid"></div></section>
<section id="free" class="screen"><div class="sec">Бесплатно</div><div id="giftGrid" class="gift-grid"></div></section>
<section id="tasks" class="screen"><div class="sec">Задания</div><div id="tasksList"></div></section>
<section id="profile" class="screen"><div class="profile"><div class="ava" id="ava">?</div><div class="name" id="name">Игрок</div><b style="color:var(--gold)">★ <span id="pbal">0</span></b><button class="wide" id="profDep">Пополнить ↙</button></div><div class="mini"><div class="row"><b>Level <span id="level">1</span></b><span class="mut"><span id="xp">0</span> / 10000 EXP</span></div><div class="bar" style="margin-top:8px"><i id="xpbar"></i></div></div><div class="mini"><div class="row"><b>Инвентарь</b><button class="ref" id="syncNft">Синхронизировать NFT</button></div></div><div class="subtabs"><button class="on" data-filter="all">Все</button><button data-filter="gift">Подарки</button><button data-filter="ton_nft">NFT</button></div><div id="inventory" class="case-grid"></div></section>
</main><nav class="nav"><button data-s="free"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2M12 22V7"/></svg>Бесплатно</button><button data-s="tasks"><svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Пропуск</button><button data-s="games" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Игры</button><button data-s="cases"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9l4-6zM2 9h20"/></svg>Кейсы</button><button data-s="profile"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>Профиль</button></nav><div class="modal" id="dep"><div class="sheet"><button class="close" id="close">×</button><h2 style="text-align:center">Пополнение баланса</h2><div id="ton-connect-root" class="ton-root"></div><div id="amounts"></div><button class="wide" id="tonPay">Подключить TON / Stars</button></div></div></div><script>
const tg=window.Telegram?.WebApp;tg?.ready?.();tg?.expand?.();let ME=null,CAT={gifts:[],cases:[],tasks:[],drops:[]},INV=[],filter='all';const h={'x-telegram-init-data':tg?.initData||''};const $=id=>document.getElementById(id);const star='<svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.35 6.2 20.4l1.1-6.47-4.7-4.58 6.5-.95L12 2.5z"/></svg>';function fmt(n){return Number(n||0).toLocaleString('ru-RU')}async function api(u,o={}){let r=await fetch(u,{...o,headers:{...h,'content-type':'application/json',...(o.headers||{})}});let j=await r.json().catch(()=>({ok:false,error:'bad_json'}));if(!r.ok) throw Error(j.error||'api_error');return j}function media(i){if(i.animation_url)return `<video autoplay loop muted playsinline src="${i.animation_url}"></video>`;if(i.image_url)return `<img src="${i.image_url}" loading="lazy">`;return '<span style="font-size:30px">★</span>'}function bg(i){return i.bg_css?`style="--bgc:${i.bg_css.replaceAll('"','&quot;')}"`:''}function setUser(){if(!ME)return; $('bal').textContent=fmt(ME.balance);$('pbal').textContent=fmt(ME.balance);$('name').textContent=ME.name;$('level').textContent=ME.level;$('xp').textContent=fmt(ME.xp);$('xpbar').style.setProperty('--w',Math.min(100,(ME.xp%10000)/100)+'%');$('ava').innerHTML=ME.photo_url?`<img src="${ME.photo_url}">`:(ME.name||'?').slice(0,1).toUpperCase()}function renderDrops(){let d=CAT.drops||[];$('drops').innerHTML=d.length?d.map(x=>`<div class="drop"><div class="media" ${bg(x)}>${media(x)}</div><b>${x.price_label||'—'}</b></div>`).join(''):'<div class="empty" style="height:74px;min-width:100%;font-size:13px">Пока нет live drops</div>'}function renderCases(){let cs=CAT.cases||[];$('caseGrid').innerHTML=cs.length?cs.map(c=>`<div class="tile" onclick="openCase(${c.id})"><div class="pic" ${bg(c)}>${media(c)}</div><div class="body"><h3>${c.title}</h3><div class="price">${fmt(c.price)} ★</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/3">Добавь кейсы в админке</div>'}function renderGifts(){let gs=CAT.gifts||[];$('giftGrid').innerHTML=gs.length?gs.map(g=>`<div class="tile"><div class="pic" ${bg(g)}>${media(g)}</div><div class="body"><h3>${g.title}</h3><div class="price">${fmt(g.price)} ★</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/3">Добавь подарки в админке</div>'}function renderTasks(){let ts=CAT.tasks||[];$('tasksList').innerHTML=ts.length?ts.map(t=>`<div class="mini task">${t.image_url?`<img src="${t.image_url}">`:''}<div><b>${t.title}</b><div class="mut">${t.description||''}</div><div class="price">${fmt(t.reward)} ★</div></div><button class="go" onclick="submitTask(${t.id},'${(t.button_url||'').replaceAll("'",'')}')">${t.submission_status||t.button_text||'Открыть'}</button></div>`).join(''):'<div class="empty">Задания создаются только в админке</div>'}function renderInv(){let arr=INV.filter(i=>filter==='all'||i.source.includes(filter)|| (filter==='gift'&&i.source!=='ton_nft'));$('inventory').innerHTML=arr.length?arr.map(i=>`<div class="tile"><div class="pic" ${bg(i)}>${media(i)}</div><div class="body"><h3>${i.title}</h3><div class="price">${i.price_label||''}</div></div></div>`).join(''):'<div class="empty" style="grid-column:1/3">Инвентарь пуст</div>'}async function load(){try{let [me,cat,inv]=await Promise.all([api('/api/me'),api('/api/catalog'),api('/api/inventory')]);ME=me.user;CAT=cat;INV=inv.items;setUser();renderDrops();renderCases();renderGifts();renderTasks();renderInv()}catch(e){console.error(e);}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.screen').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.s).classList.add('on')});document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;renderInv()});$('plus').onclick=$('profDep').onclick=()=>$('dep').classList.add('on');$('close').onclick=()=>$('dep').classList.remove('on');$('amounts').innerHTML=[30,100,200,500,1000,2500,5000].map(a=>`<div class="amount">${star}<b>${a} Звезд</b><span>○</span></div>`).join('');window.openCase=async id=>{try{let tile=[...document.querySelectorAll('.tile')].find(t=>t.outerHTML.includes(`openCase(${id})`));let anim=document.createElement('div');anim.className='case-anim';anim.innerHTML='<div class="slot">★</div><div class="slot">◆</div><div class="slot">🎁</div><div class="slot">NFT</div>';tile?.after(anim);let r=await api('/api/case/open',{method:'POST',body:JSON.stringify({caseId:id})});ME.balance=r.balance;ME.xp=r.xp;ME.level=r.level;setUser();setTimeout(()=>{anim.innerHTML=`<div class="slot" style="min-width:100%">${media(r.item)}</div>`;load()},1300)}catch(e){alert(e.message)}};$('spinBtn').onclick=()=>{let g=$('spinGame');g.classList.add('spin');setTimeout(()=>g.classList.remove('spin'),2300)};$('colorBtn').onclick=()=>{$('colorBtn').textContent='Крутится...';setTimeout(()=>$('colorBtn').textContent='Играть ›',1500)};window.submitTask=async(id,url)=>{if(url) tg?.openLink?tg.openLink(url):open(url,'_blank');await api('/api/task/submit',{method:'POST',body:JSON.stringify({taskId:id})}).catch(e=>alert(e.message));load()};let tc;async function initTon(){try{let cfg=await api('/api/config');tc=new TON_CONNECT_UI.TonConnectUI({manifestUrl:cfg.tonManifestUrl||`${location.origin}/tonconnect-manifest.json`,buttonRootId:'ton-connect-root',uiPreferences:{theme:'DARK'},actionsConfiguration:{twaReturnUrl:`https://t.me/${cfg.botUsername}`}});tc.onStatusChange(async w=>{if(!w)return;let address=w.account.address;await api('/api/wallet/connect',{method:'POST',body:JSON.stringify({address})});let r=await api('/api/ton/sync',{method:'POST',body:JSON.stringify({address})});alert(`Синхронизировано: ${r.synced}`);load()})}catch(e){console.error(e)}}$('syncNft').onclick=async()=>{if(tc) await tc.openModal();};$('tonPay').onclick=async()=>{if(tc) await tc.openModal();};initTon();load();setInterval(()=>api('/api/catalog').then(c=>{CAT.drops=c.drops;renderDrops()}).catch(()=>{}),15000);
</script></body></html>
